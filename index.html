        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            padding: 50px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin: 0 0 40px 0;
            color: #2c3e50;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #34495e;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            color: #555;
            transition: border-color 0.2s;
        }

        input[type="file"]:hover {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 18px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            background: #2980b9;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        #status {
            margin-top: 30px;
            text-align: center;
            font-size: 1.1rem;
            color: #555;
            min-height: 24px;
            font-weight: 500;
        }

        .error { 
            color: #e74c3c; 
        }
    </style>
</head>

        <h1>Minecraft Texture Pack Some Assets Remover</h1>

        <div class="input-group">
            <label for="zipFile">Select Texture Pack (.zip)</label>
            <input type="file" id="zipFile" accept=".zip">
        </div>

        <button id="processBtn" disabled>Process & Download</button>
        
        <div id="status"></div>
    </div>

                statusEl.textContent = `Removing ${filesToRemove.length} files...`;

                let removedCount = 0;
                for (const filePath of filesToRemove) {
                    let cleanPath = filePath.replace(/^\.?\//, '');
                    
                    if (zip.file(cleanPath) || zip.folder(cleanPath)) {
                        zip.remove(cleanPath);
                        removedCount++;
                    }
                }

                statusEl.textContent = `Removed ${removedCount} files. Repacking ZIP...`;

                const blob = await zip.generateAsync({ 
                    type: 'blob',
                    compression: "DEFLATE",
                    compressionOptions: { level: 6 }
                });

                statusEl.textContent = 'Downloading...';
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const originalName = zipFile.name.replace(/\.zip$/i, '');
                a.download = `${originalName}-patched.zip`;
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusEl.textContent = 'Done!';
                
                zipInput.value = '';
                processBtn.disabled = true;

            } catch (err) {
                statusEl.textContent = 'Error: ' + err.message;
                statusEl.className = 'error';
                console.error(err);
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
